version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: quarterly
    ignore:
      # Pinned and bumped by the bump-typescript-go workflow, which also
      # regenerates the shim layer; a plain version bump breaks the build.
      - dependency-name: github.com/microsoft/typescript-go
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: quarterly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: quarterly
