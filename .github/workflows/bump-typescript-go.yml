name: Bump typescript-go

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday morning UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Bump typescript-go to latest main
        run: tools/bump-tsgo.sh main
      - name: Test against the fixture oracle
        run: go test ./...
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: bump-typescript-go
          title: "Bump typescript-go to latest main"
          commit-message: "chore: bump typescript-go and regenerate shims"
          body: |
            Automated weekly bump of the pinned typescript-go version, with
            shims regenerated. CI runs the fixture suite (golden schemas,
            vega-lite, mosaic) against the new compiler.
