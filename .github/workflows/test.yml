name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go build ./...
      - run: go test ./...
      # The npm package's programmatic API drives the CLI, so it needs a binary.
      - run: go build -o .bin/ts-json-schema-generator ./cmd/ts-json-schema-generator
      - run: node --test npm/ts-json-schema-generator/test.mjs
        env:
          TS_JSON_SCHEMA_GENERATOR_BINARY: ${{ github.workspace }}/.bin/ts-json-schema-generator
