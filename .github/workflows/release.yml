name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          out="ts-json-schema-generator-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "$out" ./cmd/ts-json-schema-generator
          if [ "$GOOS" = "windows" ]; then
            zip "ts-json-schema-generator-${GOOS}-${GOARCH}.zip" "$out"
          else
            tar czf "ts-json-schema-generator-${GOOS}-${GOARCH}.tar.gz" "$out"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true

  # Publishing is gated on the repository variable PUBLISH_NPM being "true",
  # so the job stays inert until the npm token is configured.
  publish-npm:
    needs: build
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Extract binaries
        run: |
          mkdir -p binaries
          for archive in artifacts/*.tar.gz; do
            [ -e "$archive" ] || continue
            tar xzf "$archive" -C binaries
          done
          for archive in artifacts/*.zip; do
            [ -e "$archive" ] || continue
            unzip -o -q "$archive" -d binaries
          done
          ls -l binaries
      - name: Assemble packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "NPM_VERSION=$version" >> "$GITHUB_ENV"
          case "$version" in
            *-*) echo "NPM_TAG=next" >> "$GITHUB_ENV" ;;
            *) echo "NPM_TAG=latest" >> "$GITHUB_ENV" ;;
          esac
          node tools/make-npm-packages.mjs --version "$version" --binaries binaries
      # Publishing authenticates via npm trusted publishing (OIDC): each
      # package on npmjs.com lists this repo + workflow as a trusted
      # publisher, so no token secret is involved.
      - name: Publish
        run: |
          npm --version
          for package in dist-npm/ts-json-schema-generator-*; do
            npm publish "$package" --provenance --access public --tag "$NPM_TAG"
          done
          npm publish dist-npm/ts-json-schema-generator --provenance --access public --tag "$NPM_TAG"
