name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          out="ts-json-schema-generator-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "$out" ./cmd/ts-json-schema-generator
          if [ "$GOOS" = "windows" ]; then
            zip "ts-json-schema-generator-${GOOS}-${GOARCH}.zip" "$out"
          else
            tar czf "ts-json-schema-generator-${GOOS}-${GOARCH}.tar.gz" "$out"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" *.tar.gz *.zip \
            --repo "$GITHUB_REPOSITORY" --generate-notes

  # Publishes all seven packages via npm trusted publishing (OIDC).
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Extract binaries
        run: |
          mkdir -p binaries
          for archive in artifacts/*.tar.gz; do
            [ -e "$archive" ] || continue
            tar xzf "$archive" -C binaries
          done
          for archive in artifacts/*.zip; do
            [ -e "$archive" ] || continue
            unzip -o -q "$archive" -d binaries
          done
          ls -l binaries
      - name: Assemble packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "NPM_VERSION=$version" >> "$GITHUB_ENV"
          # The "next" and "canary" dist-tags belong to the TypeScript
          # implementation's release bot; the native build publishes
          # prereleases under "native".
          case "$version" in
            *-*) echo "NPM_TAG=native" >> "$GITHUB_ENV" ;;
            *) echo "NPM_TAG=latest" >> "$GITHUB_ENV" ;;
          esac
          node tools/make-npm-packages.mjs --version "$version" --binaries binaries
      # The platform packages authenticate via npm trusted publishing
      # (OIDC): each lists this repo + workflow as its trusted publisher.
      # The leading ./ keeps npm from parsing the path as a GitHub
      # owner/repo shorthand.
      - name: Publish platform packages
        run: |
          npm --version
          for package in dist-npm/ts-json-schema-generator-*; do
            name=$(basename "$package")
            # Skip versions that already exist so a partially published
            # release can be re-run.
            if npm view "$name@$NPM_VERSION" version >/dev/null 2>&1; then
              echo "$name@$NPM_VERSION already published, skipping"
              continue
            fi
            npm publish "./$package" --provenance --access public --tag "$NPM_TAG"
          done
      # The main package's trusted-publisher slot belongs to
      # vega/ts-json-schema-generator, whose automation publishes the 2.x
      # line. Until that line is retired, this repo publishes the main
      # package with a granular token scoped to it; without the secret,
      # the publish attempts OIDC (correct once the slot moves here).
      - name: Publish main package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set "//registry.npmjs.org/:_authToken=$NPM_TOKEN"
          fi
          npm publish ./dist-npm/ts-json-schema-generator --provenance --access public --tag "$NPM_TAG"
